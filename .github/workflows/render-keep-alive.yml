name: Render keep alive

on:
  schedule:
    # Every 12 minutes, offset from the busy start of each hour (UTC).
    - cron: "5,17,29,41,53 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: render-keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request backend health endpoint
        env:
          BACKEND_URL: ${{ vars.RENDER_BACKEND_URL || 'https://ai-rag-backend-sm81.onrender.com' }}
        shell: bash
        run: |
          if [[ "$BACKEND_URL" != https://* ]]; then
            echo "::error::RENDER_BACKEND_URL must start with https://."
            exit 1
          fi

          curl --fail --silent --show-error \
            --connect-timeout 15 \
            --max-time 90 \
            --retry 2 \
            --retry-delay 5 \
            --header "Cache-Control: no-cache" \
            "${BACKEND_URL%/}/api/health"
