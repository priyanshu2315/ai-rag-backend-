<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="ISGEC tender intelligence solution architecture: document ingestion, departmental historical search and engineer review.">
<title>ISGEC Tender Intelligence — Architecture</title>
<style>
:root{color-scheme:dark;--bg:#0a0c11;--panel:#11141b;--line:#1d222c;--text:#e9edf4;--muted:#a9b8cc}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,sans-serif;padding:26px 18px 30px}
.wrap{max-width:1640px;margin:auto;display:grid;gap:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{font-size:clamp(22px,2.4vw,30px);font-weight:600;letter-spacing:-.02em;margin:0 0 8px}
.subtitle{font-size:13px;color:var(--muted)}
button{color:var(--muted);background:#0f1218;border:1px solid var(--line);border-radius:7px;padding:8px 12px;cursor:pointer;font:inherit;font-size:12px}
button:hover{color:var(--text);border-color:#43dcc4}
button:focus-visible{outline:2px solid #43dcc4;outline-offset:3px}
figure{margin:0;min-width:0}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
svg{display:block;width:100%;min-width:1200px;height:auto}
.canvas{fill:var(--bg)}
.panel-bg{fill:var(--panel);stroke:var(--accent);stroke-width:1.3}
.halo{fill:none;stroke:var(--accent);stroke-width:3;opacity:.22;filter:url(#glow)}
.chip-bg{fill:var(--bg);stroke:var(--accent);stroke-opacity:.65}
.subpanel rect{fill:var(--panel);stroke:var(--accent);stroke-width:1.1}
.label{font-size:14px;font-weight:600;fill:var(--text)}
.detail{font-family:Consolas,ui-monospace,monospace;font-size:11.5px;fill:var(--muted)}
.chip{font-size:10.5px;font-weight:600;letter-spacing:.09em;fill:var(--text)}
.lane{font-size:10.5px;font-weight:600;letter-spacing:.14em;fill:#8b95a6}
.item-dot{fill:var(--accent)}
.arrow{fill:none;stroke:#a9b8cc;stroke-width:1.5}
.arrow.feedback{stroke:#f0b64a;stroke-dasharray:6 5}
.arrow.blocked{stroke:#ff8585}
.refusal rect{fill:#211416;stroke:#ff8585;stroke-width:1.2}
.blocked-label{fill:#ffadad;font-size:12px}
.search-field{fill:#0a0c11;stroke:#394354}
.search-placeholder{fill:#a9b8cc;font-size:13px}
.arrow-label{font-size:10px;fill:var(--muted)}
.foot{font-size:10px;fill:#8b95a6}
@media(max-width:640px){body{padding:20px 12px}.subtitle{line-height:1.7}.wrap{gap:14px}}
@media print{
@page{size:A3 landscape;margin:9mm}
body{padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
header{margin-bottom:8px}h1{font-size:21px}.subtitle{font-size:11px}
button{display:none}.wrap{gap:8px;max-width:none}
.scroll{overflow:visible;border:0}svg{min-width:0;width:100%;height:auto;max-height:250mm}
figure{break-inside:avoid}
}
</style>
</head>
