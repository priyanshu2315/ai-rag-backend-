<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DocuMind Architecture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
  :root { color-scheme: dark; --bg: #0a0c11; --line: #1d222c; }
  html, body { margin: 0; background: var(--bg); }
  body { padding: 16px; }
  .scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); max-width: 1640px; margin: 0 auto; }
  .scroll svg { display: block; width: 100%; min-width: 1100px; height: auto; }

  .lbl { font-family: "IBM Plex Sans", system-ui, sans-serif; font-weight: 600; font-size: 13.5px; fill: #e9edf4; }
  .fn { font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; font-size: 11.5px; fill: #a9b8cc; }
  .fn.sm { font-size: 10.5px; }
  .chip { font-family: "IBM Plex Sans", system-ui, sans-serif; font-weight: 600; font-size: 11px; letter-spacing: 0.12em; fill: #e9edf4; }
  .alb { font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; font-size: 11px; fill: #c3cad6; }
  .alb.amber { fill: #f5c66e; }

  .node { fill: #141924; stroke: #2c3442; stroke-width: 1.2; }
  .sub { fill: #0f1218; stroke: #2c3442; stroke-width: 1; }
  .ar { fill: none; stroke: #c3cad6; stroke-width: 1.5; marker-end: url(#ah); }
  .ar.amber { stroke: #f0b64a; stroke-dasharray: 6 5; marker-end: url(#aha); }
  .ar.green { stroke: #5fd38d; marker-end: url(#ahg); }
  .ar.teal { stroke: #43dcc4; marker-end: url(#aht); }
</style>
</head>
<body>
<div class="scroll">
<svg viewBox="0 0 1600 1240" role="img" aria-label="DocuMind architecture: chat API, MCP server, CRAG LangGraph pipeline with web agents (Tavily MCP) and approval, pause and resume, upload pipeline, AI models and data stores.">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#141820" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="5"/></filter>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c3cad6"/></marker>
    <marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f0b64a"/></marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fd38d"/></marker>
    <marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#43dcc4"/></marker>
  </defs>

  <rect width="1600" height="1240" fill="#0a0c11"/>
  <rect width="1600" height="1240" fill="url(#grid)"/>

  <!-- ================= PANELS ================= -->
  <!-- CRAG -->
  <rect x="300" y="36" width="830" height="730" rx="12" fill="none" stroke="#b98cff" stroke-width="3" opacity=".4" filter="url(#glow)"/>
  <rect x="300" y="36" width="830" height="730" rx="12" fill="#11141b" fill-opacity=".94" stroke="#b98cff" stroke-width="1.4"/>
  <rect x="314" y="48" width="150" height="24" rx="5" fill="#0a0c11" stroke="#b98cff" stroke-opacity=".7"/>
  <text class="chip" x="326" y="64">CRAG · LANGGRAPH</text>
  <text class="fn" x="476" y="64">cragPipeline</text>

  <!-- Pause & resume -->
  <rect x="300" y="776" width="830" height="100" rx="12" fill="#11141b" fill-opacity=".94" stroke="#f0b64a" stroke-width="1.4"/>
  <rect x="314" y="786" width="132" height="24" rx="5" fill="#0a0c11" stroke="#f0b64a" stroke-opacity=".7"/>
  <text class="chip" x="326" y="802">PAUSE &amp; RESUME</text>

  <!-- Upload -->
  <rect x="30" y="900" width="1100" height="320" rx="12" fill="none" stroke="#5fd38d" stroke-width="3" opacity=".35" filter="url(#glow)"/>
  <rect x="30" y="900" width="1100" height="320" rx="12" fill="#0e1614" fill-opacity=".92" stroke="#5fd38d" stroke-width="1.4"/>
  <rect x="44" y="912" width="80" height="24" rx="5" fill="#0a0c11" stroke="#5fd38d" stroke-opacity=".7"/>
  <text class="chip" x="56" y="928">UPLOAD</text>

  <!-- AI models -->
  <rect x="1160" y="36" width="420" height="704" rx="12" fill="#11141b" fill-opacity=".94" stroke="#f0b64a" stroke-width="1.4"/>
  <rect x="1174" y="48" width="98" height="24" rx="5" fill="#0a0c11" stroke="#f0b64a" stroke-opacity=".7"/>
  <text class="chip" x="1186" y="64">AI MODELS</text>

  <!-- Data -->
  <rect x="1160" y="760" width="420" height="460" rx="12" fill="none" stroke="#43dcc4" stroke-width="3" opacity=".35" filter="url(#glow)"/>
  <rect x="1160" y="760" width="420" height="460" rx="12" fill="#11141b" fill-opacity=".94" stroke="#43dcc4" stroke-width="1.4"/>
  <rect x="1174" y="772" width="62" height="24" rx="5" fill="#0a0c11" stroke="#43dcc4" stroke-opacity=".7"/>
  <text class="chip" x="1186" y="788">DATA</text>

  <!-- ================= ARROWS (under nodes) ================= -->
  <!-- chat API column -->
  <path class="ar" d="M150 80V108"/>
  <path class="ar" d="M150 164V188"/>
  <path class="ar" d="M150 274V298"/>
  <path class="ar" d="M150 354V378"/>
  <path class="ar" d="M260 407H288V110H323"/>
  <path class="ar" d="M325 640H262"/>
  <path class="ar" d="M40 642H20V46H138"/>
  <path class="ar teal" d="M260 735H322"/>

  <!-- intent routing -->
  <path class="ar" d="M475 122H523"/>
  <text class="alb" x="499" y="114" text-anchor="middle">search</text>

  <text class="alb" x="368" y="196">summary</text>
  <path class="ar" d="M440 149V200H515V248"/>
  <text class="alb" x="478" y="193" text-anchor="middle">page</text>
  <path class="ar" d="M325 140H312V615H323"/>

  <path class="ar" d="M380 304V598"/>

  <path class="ar" d="M730 350V302"/>
  <path class="ar" d="M850 404V418H730V428"/>
  <path class="ar" d="M660 457H640V262H718"/>

  <path class="ar" d="M800 457H838"/>

  <rect class="node" x="318" y="250" width="125" height="54" rx="8"/>

  <rect class="node" x="455" y="250" width="120" height="54" rx="8"/>

  <!-- retrieve group -->

  <text class="fn" x="805" y="98">allowedDocumentIds only</text>

  <rect class="sub" x="920" y="175" width="164" height="30" rx="6"/>
  <text class="fn" x="1002" y="194" text-anchor="middle">Cohere rerank</text>
  <path class="ar" d="M1002 205V228"/>
  <rect class="sub" x="735" y="230" width="349" height="30" rx="6"/>
  <text class="fn" x="910" y="249" text-anchor="middle">neighbor expansion</text>

  <rect class="node" x="835" y="350" width="150" height="54" rx="8"/>
  <text class="lbl" x="910" y="382" text-anchor="middle">grade</text>

  <rect class="node" x="660" y="350" width="140" height="54" rx="8"/>
  <text class="lbl" x="730" y="382" text-anchor="middle">next_hop</text>

  <rect class="node" x="660" y="430" width="140" height="54" rx="8"/>
  <text class="lbl" x="730" y="462" text-anchor="middle">rewrite</text>

  <path d="M910 427L980 457L910 487L840 457Z" fill="#141924" stroke="#2c3442" stroke-width="1.2"/>
  <text class="fn" x="910" y="461" text-anchor="middle">routeToAnswer</text>

  <rect class="node" x="835" y="570" width="150" height="54" rx="8" style="stroke:#f0b64a"/>
  <text class="lbl" x="847" y="592">ask_approval</text>
  <text class="fn" x="847" y="610">interrupt()</text>

  <!-- web agents (one per web task, parallel) -->
  <rect x="556" y="540" width="240" height="164" rx="10" fill="#121722" stroke="#43dcc4" stroke-opacity=".35"/>
  <rect x="548" y="548" width="240" height="164" rx="10" fill="#131925" stroke="#43dcc4" stroke-opacity=".5"/>
  <rect x="540" y="556" width="240" height="164" rx="10" fill="#141b27" stroke="#43dcc4" stroke-width="1.3"/>

  <text class="fn" x="556" y="598">runOneWebAgent() × N</text>
  <rect class="sub" x="556" y="612" width="90" height="36" rx="6"/>
  <text class="fn" x="601" y="634" text-anchor="middle">agent</text>
  <rect class="sub" x="676" y="612" width="90" height="36" rx="6"/>
  <text class="fn" x="721" y="634" text-anchor="middle">tools</text>
  <path class="ar" d="M646 624H674"/>
  <path class="ar" d="M676 638H648"/>
  <text class="fn" x="556" y="672">tavily_search · tavily_extract</text>
  <text class="fn" x="556" y="690">MCP client · 4 steps</text>

  <rect class="node" x="325" y="600" width="150" height="54" rx="8"/>
